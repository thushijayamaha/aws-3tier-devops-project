
name: AWS 3-Tier CD Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-deployment-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        
      - name: Diagnose OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          print("Repository:", claims.get("repository"))
          print("Ref:", claims.get("ref"))
          PY


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020529562689:role/GitHubActions-DevOps-Deploy-Role
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Test SSM SSH connection to Private EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0e5c541d531f2ba50 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["sudo -u ubuntu env -u SSH_AUTH_SOCK ssh -i /home/ubuntu/.ssh/devops-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 ubuntu@10.0.11.117 echo GITHUB_ACTIONS_PRIVATE_SSH_OK"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e5c541d531f2ba50

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e5c541d531f2ba50 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
