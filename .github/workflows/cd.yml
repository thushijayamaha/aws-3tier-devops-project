
name: AWS 3-Tier CD Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-deployment-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020529562689:role/GitHubActions-DevOps-Deploy-Role
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Test SSM command on Public EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0e5c541d531f2ba50 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo GITHUB_ACTIONS_SSM_OK"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e5c541d531f2ba50

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e5c541d531f2ba50 \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
